<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: Parisian minimalism. Ivory ground, navy ink, one burgundy accent. An arched "window" portrait anchors the hero; the CEFR ladder (A1 to C2) is the recurring structural motif. */
:root{
  --bg:#F7F3EB; --surface:#FFFDF8; --surface-2:#EFE9DC; --ink:#14213D; --muted:#586078;
  --line:#DDD4C3; --accent:#7A2437; --accent-ink:#FFFFFF; --accent-soft:#F1DEE1; --ph-line:#B8606F;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1526; --surface:#162038; --surface-2:#1C2744; --ink:#EEE9DD; --muted:#A5ACBF;
  --line:#2C3858; --accent:#E0909F; --accent-ink:#1A0A10; --accent-soft:#3A1D2B; --ph-line:#C97887; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1526; --surface:#162038; --surface-2:#1C2744; --ink:#EEE9DD; --muted:#A5ACBF;
  --line:#2C3858; --accent:#E0909F; --accent-ink:#1A0A10; --accent-soft:#3A1D2B; --ph-line:#C97887; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 em,h2 em{color:var(--accent);font-style:italic}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1140px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--bg);padding:.5rem 1rem;z-index:50}
.skip:focus{left:8px}
.ph{outline:1px dashed var(--ph-line);outline-offset:3px;border-radius:2px}

/* editing strip */
.strip{background:var(--accent-soft);color:var(--ink);font-size:.875rem}
.strip .wrap{display:flex;gap:1rem;align-items:center;justify-content:space-between;padding-block:.5rem}
.strip button{font:inherit;color:inherit;background:none;border:1px solid var(--ph-line);border-radius:999px;padding:.15rem .8rem;cursor:pointer}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.25rem;padding-block:.75rem}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-family:var(--display);font-size:1.3rem;margin-right:auto}
.logo .mark{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 .8rem var(--body);letter-spacing:.04em}
.nav{display:flex;gap:1.4rem;font-size:.95rem}
.nav a{text-decoration:none;color:var(--muted);padding:.25rem 0;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:600 .8rem var(--body);letter-spacing:.06em;border:0;background:none;color:var(--muted);padding:.35rem .75rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme{display:grid;place-items:center;width:2.15rem;height:2.15rem;border:1px solid var(--line);border-radius:50%;background:none;color:var(--ink);cursor:pointer;padding:0}
.theme:hover{border-color:var(--accent);color:var(--accent)}
.theme svg{width:1.05rem;height:1.05rem}
@media (max-width:900px){.nav{order:5;flex-basis:100%;overflow-x:auto;gap:1.2rem;padding-bottom:.1rem}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;font:600 .95rem var(--body);text-decoration:none;border-radius:999px;padding:.8rem 1.4rem;border:1.5px solid transparent;cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{border-color:var(--ink);color:var(--ink);background:none}
.btn-sm{padding:.5rem 1rem;font-size:.85rem}

/* sections */
section{scroll-margin-top:120px}
.band{padding-block:clamp(3.5rem,8vw,6.5rem)}
.band.alt{background:var(--surface);border-block:1px solid var(--line)}
.eyebrow{font:600 .75rem var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:.9rem}
.sec-head{max-width:40rem;margin-bottom:clamp(2rem,4vw,3rem)}
.sec-head h2{font-size:clamp(2rem,4.4vw,3.1rem)}
.sec-head p{color:var(--muted);margin-top:.9rem}

/* hero */
.hero{padding-block:clamp(2.5rem,6vw,5rem)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(2rem,5vw,4.5rem);align-items:center}
.hero h1{font-size:clamp(2.7rem,6.4vw,4.9rem);margin-bottom:1.4rem}
.hero .lead{font-size:1.15rem;color:var(--muted);max-width:34rem}
.hero .lead .ph{display:inline-block;margin-top:.6rem}
.cta-row{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}
.arch-wrap{position:relative;max-width:380px;width:100%;justify-self:center}
.arch-wrap::before{content:"";position:absolute;inset:14px -14px -14px 14px;border:1.5px solid var(--accent);border-radius:999px 999px 20px 20px;z-index:0}
.arch{position:relative;z-index:1;aspect-ratio:4/5;border-radius:999px 999px 18px 18px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.arch img{width:100%;height:100%;object-fit:cover}
.arch .empty{display:grid;justify-items:center;gap:.5rem;color:var(--muted);font-size:.85rem;padding-top:4rem}
.arch svg{width:55%;height:auto;color:var(--line);opacity:.9}
.badge{position:absolute;z-index:2;left:-1rem;bottom:2.2rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem .9rem;font-size:.82rem;box-shadow:0 8px 24px rgb(0 0 0 / .08)}
.badge b{display:block;font-family:var(--display);font-size:1.1rem;font-weight:600}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}.arch-wrap{max-width:300px}.badge{left:0}}

/* CEFR ladder */
.ladder{list-style:none;display:flex;gap:.4rem;padding:0;margin:0;flex-wrap:wrap}
.ladder li{font:600 .8rem var(--body);letter-spacing:.06em;padding:.35rem .7rem;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface)}
.ladder li.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ladder-bar{margin-top:clamp(2.5rem,5vw,4rem);display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.5rem;padding-top:1.5rem;border-top:1px solid var(--line)}
.ladder-bar .txt{color:var(--muted);font-size:.95rem;margin-right:auto}
.ladder-bar a{color:var(--accent);font-weight:600;text-underline-offset:4px}

/* about */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4rem)}
.about-grid h3{font-size:1.5rem;margin-bottom:1rem}
.about-grid p{color:var(--muted)}
dl.facts{margin:0;display:grid;gap:0}
dl.facts div{display:grid;grid-template-columns:9rem 1fr;gap:1rem;padding:.9rem 0;border-top:1px solid var(--line)}
dl.facts div:last-child{border-bottom:1px solid var(--line)}
dt{font:600 .75rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding-top:.3rem}
dd{margin:0;min-width:0}
@media (max-width:820px){.about-grid{grid-template-columns:1fr}dl.facts div{grid-template-columns:1fr;gap:.2rem}}

/* services */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.6rem;display:flex;flex-direction:column;gap:.7rem;min-width:0}
.band.alt .card{background:var(--bg)}
.card .kicker{font:italic 400 1.05rem var(--display);color:var(--accent)}
.card h3{font-size:1.35rem}
.card p{color:var(--muted);font-size:.98rem}
@media (max-width:900px){.cards{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.cards{grid-template-columns:1fr}}

/* quiz */
.quiz{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(2rem,5vw,4rem);align-items:start}
.quiz-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(1.3rem,3vw,2rem);min-width:0}
.q-meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:.8rem}
.q-bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:1.5rem}
.q-bar span{display:block;height:100%;background:var(--accent);transition:width .35s}
.q-text{font:400 clamp(1.3rem,2.6vw,1.65rem)/1.25 var(--display);margin-bottom:1.4rem}
.opts{display:grid;gap:.6rem}
.opt{font:500 1rem var(--body);text-align:left;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.linkbtn{font:500 .85rem var(--body);background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-top:1.2rem;padding:0}
.res-level{font:italic 400 clamp(2.4rem,6vw,3.4rem)/1 var(--display);color:var(--accent);margin:.3rem 0 1rem}
.res p{color:var(--muted);margin-bottom:1rem}
.res .sug{color:var(--ink)}
.res small{display:block;color:var(--muted);margin-top:1.1rem;font-size:.82rem}
@media (max-width:820px){.quiz{grid-template-columns:1fr}}

/* pricing */
.price-card{gap:1rem}
.price{font:600 2.4rem/1 var(--display)}
.price small{font:400 .85rem var(--body);color:var(--muted);margin-left:.3rem}
.dur{font:600 .75rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.price-card ul{list-style:none;padding:0;margin:0;display:grid;gap:.5rem;color:var(--muted);font-size:.96rem;flex:1}
.price-card li{padding-left:1.2rem;position:relative}
.price-card li::before{content:"";position:absolute;left:0;top:.7em;width:.6rem;height:1.5px;background:var(--accent)}
.intro{margin-bottom:1.25rem;display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:14px;padding:1.5rem 1.8rem}
.intro h3{font-size:1.35rem}
.intro p{color:var(--muted);max-width:36rem;margin-top:.3rem}
.tef{margin-top:1.25rem;display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,4vw,3rem);background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:clamp(1.4rem,3vw,2.2rem)}
.tef>div{min-width:0}
.tef .cta-row{margin-top:1.5rem}
.steps{list-style:none;padding:0;margin:0 0 1.6rem;display:grid;gap:1.1rem;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:.8rem}
.steps li::before{content:counter(s);display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;border:1px solid var(--accent);color:var(--accent);font:600 .85rem var(--body)}
.steps h4{margin:0;font:400 1.15rem/1.25 var(--display)}
.steps p{color:var(--muted);font-size:.95rem;margin-top:.15rem}
@media (max-width:820px){.tef{grid-template-columns:1fr}}

/* career path */
.journey{margin-top:clamp(3rem,6vw,5rem);padding-top:clamp(2rem,4vw,3rem);border-top:1px solid var(--line);display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(2rem,5vw,4rem)}
.jr-h{font-size:clamp(1.7rem,3.4vw,2.3rem)}
.path{position:relative;padding-left:2.2rem;min-width:0}
.path-line{position:absolute;left:.55rem;top:.6rem;bottom:.6rem;width:2px;background:var(--line);border-radius:2px}
.path-line i{display:block;width:100%;height:0;background:var(--accent);border-radius:2px;transition:height .25s linear}
.path ol{list-style:none;margin:0;padding:0;display:grid;gap:2rem}
.path li{position:relative;min-width:0}
.path li::before{content:"";position:absolute;left:calc(-2.1rem + 1px);top:.35rem;width:.9rem;height:.9rem;border-radius:50%;background:var(--surface);border:2px solid var(--line);transition:background .3s,border-color .3s}
.path li.on::before{border-color:var(--accent);background:var(--accent)}
.jr-when{display:block;font:600 .75rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.jr-role{font:400 1.3rem/1.25 var(--display);margin-top:.25rem}
.jr-where{color:var(--muted);font-size:.95rem;margin-top:.1rem}
.jr-text{color:var(--muted);margin-top:.45rem;font-size:.98rem}
@media (max-width:820px){.journey{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.path-line i,.path li::before{transition:none}}

/* why */
.why{display:grid;grid-template-columns:repeat(2,1fr);gap:0 clamp(2rem,5vw,4rem)}
.why div{padding:1.4rem 0;border-top:1px solid var(--line)}
.why h3{font-size:1.3rem;margin-bottom:.4rem}
.why p{color:var(--muted)}
@media (max-width:700px){.why{grid-template-columns:1fr}}

/* reviews */
.rev blockquote{margin:0;font:italic 400 1.15rem/1.45 var(--display)}
.rev cite{font:500 .88rem var(--body);font-style:normal;color:var(--muted)}
.note{margin-top:1.5rem;font-size:.9rem;color:var(--muted)}

/* booking */
.book{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(2rem,5vw,4rem);align-items:start}
.book h2{font-size:clamp(2rem,4.4vw,3.1rem);margin-bottom:1rem}
.book .info>p{color:var(--muted);margin-bottom:1.5rem}
.contact-lines{display:grid;gap:.8rem;margin-top:1.8rem;padding-top:1.4rem;border-top:1px solid var(--line);font-size:.98rem}
.contact-lines b{display:block;font:600 .72rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.contact-lines span{user-select:all;overflow-wrap:anywhere}
form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(1.3rem,3vw,2rem);display:grid;grid-template-columns:1fr 1fr;gap:1rem;min-width:0}
.field{display:grid;gap:.35rem;min-width:0}
.field.full{grid-column:1/-1}
label{font:600 .82rem var(--body)}
input,select,textarea{font:400 1rem var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.7rem .85rem;width:100%;min-width:0}
textarea{min-height:6rem;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.out{grid-column:1/-1;border:1px dashed var(--accent);border-radius:12px;padding:1.1rem;display:grid;gap:.8rem;background:var(--accent-soft)}
.out p{font-size:.95rem}
.out textarea{min-height:9rem;font-size:.92rem}
@media (max-width:820px){.book{grid-template-columns:1fr}}
@media (max-width:520px){form{grid-template-columns:1fr}}

/* faq */
.faq{max-width:46rem}
details{border-top:1px solid var(--line);padding:1.1rem 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:1rem;font:400 1.25rem/1.3 var(--display)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:300 1.6rem/1 var(--body);color:var(--accent);transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--muted);margin-top:.8rem;max-width:40rem}

footer{border-top:1px solid var(--line);padding-block:2rem;font-size:.9rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:1rem 2rem;justify-content:space-between}

/* motion: content is visible at rest; a small lift is added on scroll */
.rv{transform:translateY(14px);transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{transform:none;transition:none}.btn,.q-bar span{transition:none}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>

<div class="strip" id="strip"><div class="wrap">
  <span data-i18n="strip"></span>
  <button type="button" id="stripHide" data-i18n="hide"></button>
</div></div>

<header class="top"><div class="wrap bar">
  <a class="logo" href="#top"><span class="mark">PF</span><span>Parlons Français</span></a>
  <nav class="nav" aria-label="Main">
    <a href="#about" data-i18n="nav_about"></a>
    <a href="#services" data-i18n="nav_services"></a>
    <a href="#quiz" data-i18n="nav_quiz"></a>
    <a href="#pricing" data-i18n="nav_pricing"></a>
    <a href="#reviews" data-i18n="nav_reviews"></a>
    <a href="#faq" data-i18n="nav_faq"></a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="fr" aria-pressed="false">FR</button>
  </div>
  <button type="button" class="theme" id="themeBtn"></button>
  <a class="btn btn-primary btn-sm js-book" href="#book" data-i18n="cta_book"></a>
</div></header>

<main id="main">

<section class="hero" id="top"><div class="wrap">
  <div class="hero-grid">
    <div class="rv">
      <p class="eyebrow" data-i18n="hero_eyebrow"></p>
      <h1 data-i18n="hero_h1"></h1>
      <p class="lead"><span data-i18n="hero_p"></span><br><span data-i18n="hero_ph"></span></p>
      <div class="cta-row">
        <a class="btn btn-primary js-book" href="#book" data-i18n="cta_book"></a>
        <a class="btn btn-ghost" href="#services" data-i18n="cta_services"></a>
      </div>
    </div>
    <div class="arch-wrap rv">
      <div class="arch">
        <img id="photo" alt="" hidden>
        <div class="empty" id="photoEmpty">
          <svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><circle cx="50" cy="36" r="18"/><path d="M12 100c0-24 17-38 38-38s38 14 38 38z"/></svg>
          <span data-i18n="photo"></span>
        </div>
      </div>
      <div class="badge"><span data-i18n="badge"></span><b data-i18n="badge_v"></b></div>
    </div>
  </div>
  <div class="ladder-bar rv">
    <p class="txt" data-i18n="ladder_txt"></p>
    <ol class="ladder" aria-label="CEFR levels"><li>A1</li><li>A2</li><li>B1</li><li>B2</li><li>C1</li><li>C2</li></ol>
    <a href="#quiz" data-i18n="ladder_link"></a>
  </div>
</div></section>

<section id="about" class="band alt"><div class="wrap">
  <div class="about-grid">
    <div class="rv">
      <p class="eyebrow" data-i18n="nav_about"></p>
      <h2 style="font-size:clamp(2rem,4.4vw,3.1rem);margin-bottom:1.2rem" data-i18n="about_h2"></h2>
      <p data-i18n="about_p"></p>
      <h3 style="margin-top:2rem" data-i18n="phil_h"></h3>
      <p style="margin-top:.7rem" data-i18n="phil_p"></p>
    </div>
    <dl class="facts rv">
      <div><dt data-i18n="f_exp"></dt><dd data-i18n="f_exp_v"></dd></div>
      <div><dt data-i18n="f_qual"></dt><dd data-i18n="f_qual_v"></dd></div>
      <div><dt data-i18n="f_lang"></dt><dd data-i18n="f_lang_v"></dd></div>
      <div><dt data-i18n="f_lvl"></dt><dd data-i18n="f_lvl_v"></dd></div>
    </dl>
  </div>
  <div class="journey">
    <div class="rv">

var lang="en", qi=0, ans=[];
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

function phWrap(v,def){return v===def?'<span class="ph">'+v+'</span>':v}
function fmt(s){return s.replace(/\{name\}/g,phWrap(CONFIG.name,DEFAULTS.name)).replace(/\{email\}/g,phWrap(CONFIG.email,DEFAULTS.email))}
function T(k){return I[lang][k]||""}

function levelIndex(){var c=0;while(c<5&&ans[c]===2)c++;return c}
var LEVELVAL=["beginner","A1","A2","B1","B2","C1"];
var LADDER=["A1","A2","B1","B2","C1","C2"];

function renderQuiz(){
  var box=$("#quizBody");if(!box)return;
  if(qi<5){
    var h='<div class="q-meta"><span>'+T("q_of").replace("{n}",qi+1)+'</span></div>'
      +'<div class="q-bar"><span style="width:'+(qi/5*100)+'%"></span></div>'
      +'<p class="q-text">'+T("q"+(qi+1))+'</p><div class="opts">';
    [2,1,0].forEach(function(v){h+='<button type="button" class="opt" data-act="ans" data-v="'+v+'">'+T("a"+v)+'</button>'});
    h+='</div>';
    if(qi>0)h+='<button type="button" class="linkbtn" data-act="back">'+T("back")+'</button>';
    box.innerHTML=h;
  }else{
    var c=levelIndex();
    var lad='<ol class="ladder">'+LADDER.map(function(l,i){return '<li class="'+(i===c-1?'on':'')+'">'+l+'</li>'}).join("")+'</ol>';
    box.innerHTML='<div class="res"><p class="eyebrow">'+T("res_eb")+'</p>'
      +'<div class="res-level">'+T("lvl"+c)+'</div>'+lad
      +'<p class="sug" style="margin-top:1.2rem"><strong>'+T("res_sug")+':</strong> '+T("sug"+c)+'</p>'
      +'<div style="display:flex;gap:.7rem;flex-wrap:wrap"><a class="btn btn-primary js-book js-quizbook" href="#book" data-lv="'+LEVELVAL[c]+'">'+T("cta_intro")+'</a>'
      +'<button type="button" class="btn btn-ghost" data-act="retake">'+T("retake")+'</button></div>'
      +'<small>'+T("res_note")+'</small></div>';
    wireBook();
  }
}

function wireBook(){
  if(!CONFIG.bookingUrl)return;
  $$(".js-book").forEach(function(a){
    if(a.classList.contains("js-tef"))return;
    var key=(a.classList.contains("js-intro")||a.classList.contains("js-quizbook"))?"intro":a.getAttribute("data-len");
    var url=(key&&CONFIG.links[key])||CONFIG.bookingUrl;
    a.href=url;a.target="_blank";a.rel="noopener";
  });
}

function applyLang(l){
  lang=l;document.documentElement.lang=l;
  $$("[data-i18n]").forEach(function(el){el.innerHTML=fmt(T(el.getAttribute("data-i18n")))});
  $$("[data-i18n-ph]").forEach(function(el){el.setAttribute("placeholder",T(el.getAttribute("data-i18n-ph")))});
  $$(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lang")===l?"true":"false")});
  $("#emailShow").textContent=CONFIG.email;
  $("#emailShow").classList.toggle("ph",CONFIG.email===DEFAULTS.email);
  renderQuiz();
  if(!$("#out").hidden)buildOut();
  renderPath();
  updateThemeBtn();
  try{localStorage.setItem("pf-lang",l)}catch(e){}
}

/* quiz events */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");
  if(t){
    var a=t.getAttribute("data-act");
    if(a==="ans"){ans[qi]=+t.getAttribute("data-v");qi++;renderQuiz()}
    else if(a==="back"){qi=Math.max(0,qi-1);renderQuiz()}
    else if(a==="retake"){qi=0;ans=[];renderQuiz()}
    return;
  }
  var q=e.target.closest(".js-quizbook");
  if(q){setSel("f-level",q.getAttribute("data-lv"));setSel("f-intent","intro")}
  var len=e.target.closest(".js-len");
  if(len){setSel("f-len",len.getAttribute("data-len"));setSel("f-intent","book")}
  if(e.target.closest(".js-intro")){setSel("f-intent","intro")}
  if(e.target.closest(".js-tef")){setSel("f-intent","question");var tm=document.getElementById("f-msg");if(tm&&!tm.value.trim())tm.value=T("tef_msg")}
});
function setSel(id,v){var el=document.getElementById(id);if(el)el.value=v}

/* form: builds a copyable request; this page cannot send messages */
function buildOut(){
  var d=function(id){return document.getElementById(id)};
  var sel=function(id){var s=d(id);return s.options[s.selectedIndex].text};
  var intent=d("f-intent").value;
  var name=d("f-name").value.trim()||"…";
  var lines=[T("m_hello").replace("{n}",name),T("m_"+intent)];
  if(intent!=="question"){
    lines.push(T("m_len")+": "+sel("f-len"));
    lines.push(T("m_days")+": "+sel("f-day"));
    lines.push(T("m_time")+": "+sel("f-time"));
  }
  lines.push(T("m_level")+": "+sel("f-level"));
  if(d("f-email").value.trim())lines.push(T("m_email")+": "+d("f-email").value.trim());
  if(d("f-msg").value.trim()){lines.push("");lines.push(d("f-msg").value.trim())}
  d("outText").value=lines.join("\n");
  d("outNote").innerHTML=fmt(CONFIG.bookingUrl?T("out_note_cal"):T("out_note"));
  d("mailBtn").href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent("Parlons Français – "+sel("f-intent"))+"&body="+encodeURIComponent(d("outText").value);
}
$("#reqForm").addEventListener("submit",function(e){
  e.preventDefault();
  $("#out").hidden=false;buildOut();$("#copyState").textContent="";
  $("#out").scrollIntoView({behavior:"smooth",block:"nearest"});
});
$("#copyBtn").addEventListener("click",function(){
  var ta=$("#outText"),st=$("#copyState");
  function fallback(){ta.focus();ta.select();st.textContent=T("copy_fail")}
  try{navigator.clipboard.writeText(ta.value).then(function(){st.textContent=T("copied")},fallback)}catch(err){fallback()}
});

/* booking links */
(function(){
  if(CONFIG.bookingUrl){
    $$(".js-cal").forEach(function(a){a.href=CONFIG.calendarUrl||CONFIG.bookingUrl;a.target="_blank";a.rel="noopener"});
  }else{
    $$(".js-cal").forEach(function(a){a.hidden=true});
  }
  if(CONFIG.photoSrc){var p=$("#photo");p.src=CONFIG.photoSrc;p.hidden=false;$("#photoEmpty").hidden=true}
  wireBook();
  $("#emailShow").href="mailto:"+CONFIG.email;
  $("#copyright").textContent="© "+new Date().getFullYear()+" "+CONFIG.name;
})();

$$(".lang button").forEach(function(b){b.addEventListener("click",function(){applyLang(b.getAttribute("data-lang"))})});
$("#stripHide").addEventListener("click",function(){$("#strip").hidden=true});

/* scroll lift */
(function(){
  var els=$$(".rv");
  if(!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in")});return}
  var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}})},{threshold:.12});
  els.forEach(function(e){io.observe(e)});
})();

/* career path: the line fills and nodes light up as you scroll */
function renderPath(){
  var list=$("#pathList");if(!list)return;
  var items=CONFIG.experience&&CONFIG.experience.length?CONFIG.experience:null,h="";
  if(items){
    items.forEach(function(x){
      var d=x[lang]||x.en||{};
      h+='<li><span class="jr-when">'+(typeof x.when==="object"?x.when[lang]:x.when)+'</span><div class="jr-role">'+(d.role||"")+'</div><div class="jr-where">'+(d.place||"")+'</div><p class="jr-text">'+(d.text||"")+'</p></li>';
    });
  }else{
    for(var i=0;i<4;i++){
      h+='<li><span class="jr-when"><span class="ph">'+T("jr_when")+'</span></span><div class="jr-role"><span class="ph">'+T("jr_role")+'</span></div><div class="jr-where"><span class="ph">'+T("jr_where")+'</span></div><p class="jr-text"><span class="ph">'+T("jr_text")+'</span></p></li>';
    }
  }
  list.innerHTML=h;
  updatePath();
}
function updatePath(){
  var p=$("#path"),fill=$("#pathFill");if(!p||!fill)return;
  var reduce=false;try{reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  var total=p.offsetHeight,top=p.getBoundingClientRect().top;
  var h=reduce?total:Math.max(0,Math.min(total,window.innerHeight*0.6-top));
  fill.style.height=h+"px";
  $$("#pathList li").forEach(function(li){li.classList.toggle("on",reduce||li.offsetTop+10<=h)});
}
(function(){
  var tick=false;
  function sched(){if(tick)return;tick=true;requestAnimationFrame(function(){tick=false;updatePath()})}
  window.addEventListener("scroll",sched,{passive:true});
  window.addEventListener("resize",sched);
  window.addEventListener("load",sched);
})();

/* light / dark mode: follows the system until the visitor picks one */
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
var THLABEL={en:["Switch to dark mode","Switch to light mode"],fr:["Passer en mode sombre","Passer en mode clair"]};
function isDark(){
  var a=document.documentElement.getAttribute("data-theme");
  if(a)return a==="dark";
  try{return window.matchMedia("(prefers-color-scheme: dark)").matches}catch(e){return false}
}
function updateThemeBtn(){
  var b=$("#themeBtn");if(!b)return;
  var d=isDark();
  b.innerHTML=d?SUN:MOON;
  var l=THLABEL[lang][d?1:0];
  b.setAttribute("aria-label",l);b.setAttribute("title",l);
}
$("#themeBtn").addEventListener("click",function(){
  var next=isDark()?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("pf-theme",next)}catch(e){}
  updateThemeBtn();
});
try{var th=localStorage.getItem("pf-theme");if(th==="dark"||th==="light")document.documentElement.setAttribute("data-theme",th)}catch(e){}
